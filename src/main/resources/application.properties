quarkus.http.port=${HTTP_PORT:8080}
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.micrometer.export.prometheus.enabled=true
mp.messaging.outgoing.scale-readings-out.connector=smallrye-kafka
mp.messaging.outgoing.scale-readings-out.topic=scale-readings
mp.messaging.outgoing.scale-readings-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.scale-readings-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.scale-readings-in.connector=smallrye-kafka
mp.messaging.incoming.scale-readings-in.topic=scale-readings
mp.messaging.incoming.scale-readings-in.value.deserializer=org.acme.domain.ReadingDeserializer
mp.messaging.incoming.scale-readings-in.group.id=weighing-processor
mp.messaging.incoming.scale-readings-in.auto.offset.reset=earliest
mp.messaging.incoming.scale-readings-in.commit-strategy=throttled
weighing.stable-samples=${STABLE_SAMPLES:20}
weighing.tolerance-kg=${STABLE_TOLERANCE_KG:2.0}
%prod.quarkus.datasource.username=${DB_USERNAME:weighing}
%prod.quarkus.datasource.password=${DB_PASSWORD:weighing}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/weighing}
%prod.mp.messaging.connector.smallrye-kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

%dev.quarkus.datasource.dev-ui.allow-sql=true
