services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weighing
      POSTGRES_USER: weighing
      POSTGRES_PASSWORD: weighing
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weighing -d weighing"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
#    extra_hosts:
#      - "host.docker.internal:host-gateway"
    ports: ["8080:8080", "5005:5005"]
    environment:
#      DB_URL: jdbc:postgresql://host.docker.internal:5432/weighing
      DB_USERNAME: ${DB_USERNAME:-weighing}
      DB_PASSWORD: ${DB_PASSWORD:-weighing}
      DB_URL: jdbc:postgresql://postgres:5432/weighing
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
